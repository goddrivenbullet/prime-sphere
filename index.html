<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>Prime Sphere</title>
<!-- touchctl-v2-20261109 -->
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#05080f;overflow:hidden;position:fixed;inset:0;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;overscroll-behavior:none;outline:none}
#ui{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;z-index:2;pointer-events:none}
#ui button{pointer-events:auto;background:rgba(255,255,255,.14);color:#eee;border:1px solid rgba(255,255,255,.28);border-radius:22px;padding:10px 16px;font:17px/1 -apple-system,system-ui,sans-serif;min-width:48px;min-height:48px;-webkit-appearance:none;appearance:none}
#ui button:active{background:rgba(255,255,255,.28)}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
<button type="button" id="zm" aria-label="zoom out">−</button>
<button type="button" id="zp" aria-label="zoom in">+</button>
<button type="button" id="pp" aria-label="pause">❚❚</button>
<button type="button" id="sp" aria-label="speed">1×</button>
<button type="button" id="rv" aria-label="reset view">⟲</button>
<button type="button" id="rs" aria-label="restart">✦</button>
</div>
<script>
(function(){
'use strict';
const MARKER='touchctl-v2-20261109';
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
function isP(n){if(n<2)return false;if(n%2===0)return n===2;for(let d=3;d*d<=n;d+=2)if(n%d===0)return false;return true}
const G=Math.PI*(3-Math.sqrt(5));
function nrm(k){if(k<8){const a=(8+14*k)*Math.PI/180;return[0,Math.cos(a),Math.sin(a)]}const i=k-8,y=1-((i*.618034)%1)*2,r=Math.sqrt(Math.max(0,1-y*y)),f=i*G;return[Math.cos(f)*r,y,Math.sin(f)*r]}
function bas(n){const a=Math.abs(n[0])<.9?[1,0,0]:[0,1,0];let u=[n[1]*a[2]-n[2]*a[1],n[2]*a[0]-n[0]*a[2],n[0]*a[1]-n[1]*a[0]];const L=Math.hypot(u[0],u[1],u[2]);u=[u[0]/L,u[1]/L,u[2]/L];return[u,[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]]]}
const rad=k=>Math.pow(k+1,.75);
function mk(k,born){const n=nrm(k),[u,v]=bas(n),r=rad(k),pts=[],th=[];for(let m=360*k;m<360*(k+1);m++)if(m>5&&isP(m)){const t=(m%360)*Math.PI/180,c=Math.cos(t),s=Math.sin(t);pts.push([r*(u[0]*c+v[0]*s),r*(u[1]*c+v[1]*s),r*(u[2]*c+v[2]*s)]);th.push(m%360)}
const hue=k<28?300-250*k/27:(50-(k-28)*9+3600)%360;return{k,pts,th,hue,born}}
const GROW=2600,MAXC=14,UZ_MIN=.3,UZ_MAX=8;
let S=[],T=0,next=0,last=0,play=true,speed=1;
const V={yaw:.3,pitch:.35,userZoom:1,fit:1.2,dragging:false,
  vy:0,vp:0, // inertia
  pinch0:0,uz0:1,
  midX:0,midY:0, // for 2-finger rotate
  lastTap:0
};
const touches=new Map(); // id -> {x,y}
const hasTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

function clampUz(z){return Math.min(UZ_MAX,Math.max(UZ_MIN,z))}
function size(){const dpr=Math.min(window.devicePixelRatio||1,3),W=window.innerWidth||document.documentElement.clientWidth||390,H=window.innerHeight||document.documentElement.clientHeight||844;const tw=Math.max(1,Math.round(W*dpr)),th=Math.max(1,Math.round(H*dpr));if(cv.width!==tw||cv.height!==th){cv.width=tw;cv.height=th}return{dpr,W,H}}

function applyRotate(dx,dy){
  V.yaw+=dx*.009;
  V.pitch=Math.max(-1.55,Math.min(1.55,V.pitch+dy*.009));
  V.vy=dx*.009; V.vp=dy*.009;
}
function resetView(){V.userZoom=1;V.yaw=.3;V.pitch=.35;V.vy=0;V.vp=0}

function frame(now){requestAnimationFrame(frame);const{dpr,W,H}=size();
const dt=last?Math.min(64,now-last):16;last=now;
if(play){T+=dt*speed;while(T>=next){S.push(mk(S.length,next));next+=S.length<8?2400:1600}}
// auto-spin only when not dragging and no lingering inertia kick from user
if(play&&!V.dragging){
  if(Math.abs(V.vy)+Math.abs(V.vp)>.00002){
    V.yaw+=V.vy; V.pitch=Math.max(-1.55,Math.min(1.55,V.pitch+V.vp));
    const damp=Math.pow(.92,dt/16); V.vy*=damp; V.vp*=damp;
  }else{
    V.yaw+=.00018*dt*Math.max(1,speed*.6);
  }
}
let rt=1.2;for(const s of S){const p=Math.min(1,(T-s.born)/GROW);rt=Math.max(rt,rad(s.k)*(.4+.6*p)*1.08)}
V.fit+=(rt-V.fit)*Math.min(1,dt/500);

ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#05080f';ctx.fillRect(0,0,W,H);
const cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),cp=Math.cos(V.pitch),sp=Math.sin(V.pitch);
const sc=.46*Math.min(W,H)*V.userZoom/V.fit;
// near-plane clamp: camera distance scales with fit; when zoomed in, points can go behind camera — skip them
const D=Math.max(V.fit*1.15, V.fit*4/Math.max(1,V.userZoom*.55));
const near=-D*.92;
const pr=q=>{const x1=q[0]*cy+q[2]*sy,z1=-q[0]*sy+q[2]*cy,y2=q[1]*cp-z1*sp,z2=q[1]*sp+z1*cp;if(z2<=near)return null;const f=D/(D+z2);return[W/2+x1*sc*f,H/2-y2*sc*f,z2]};
ctx.globalCompositeOperation='lighter';const n=S.length;
for(let si=0;si<n;si++){const s=S[si],age=T-s.born;if(age<0)continue;const p=Math.min(1,age/GROW),g=.4+.6*(1-Math.pow(1-p,3));
const raw=s.pts.map(q=>pr([q[0]*g,q[1]*g,q[2]*g]));
const P=raw; const shown=Math.max(1,Math.ceil(s.pts.length*Math.min(1,Math.max(p,.02)*1.6)));
if(n-1-si<MAXC){const cpg=Math.max(0,(p-.25)/.75),fade=1-Math.max(0,(n-1-si)-(MAXC-4))/4;ctx.strokeStyle='hsla('+s.hue+',90%,60%,'+(.07*fade).toFixed(3)+')';ctx.lineWidth=.6;ctx.beginPath();const m=P.length,lim=Math.floor(m*cpg);for(let i=0;i<lim;i++){if(!P[i])continue;for(let j=i+1;j<m;j++){if(!P[j])continue;ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[j][0],P[j][1])}}ctx.stroke()}
if(si>0&&p>.3){const pv=S[si-1],pg=.4+.6*Math.min(1,(T-pv.born)/GROW),idx=new Map();pv.th.forEach((t,i)=>idx.set(t,i));ctx.strokeStyle='hsla('+s.hue+',40%,88%,'+(.35*Math.min(1,(p-.3)/.4)).toFixed(3)+')';ctx.lineWidth=.8;ctx.beginPath();s.th.forEach((t,i)=>{const j=idx.get(t);if(j===undefined||!P[i])return;const a=pr(pv.pts[j].map(x=>x*pg));if(!a)return;ctx.moveTo(a[0],a[1]);ctx.lineTo(P[i][0],P[i][1])});ctx.stroke()}
for(let i=0;i<shown;i++){const q=P[i];if(!q)continue;const rr=Math.max(1,2.1*D/(D+q[2]));ctx.fillStyle='hsla('+s.hue+',95%,60%,.18)';ctx.beginPath();ctx.arc(q[0],q[1],rr*2.6,0,6.2832);ctx.fill();ctx.fillStyle='hsla('+s.hue+',95%,72%,.95)';ctx.beginPath();ctx.arc(q[0],q[1],rr,0,6.2832);ctx.fill()}}
ctx.globalCompositeOperation='source-over'}

function touchList(e){const arr=[];for(let i=0;i<e.touches.length;i++){const t=e.touches[i];arr.push({id:t.identifier,x:t.clientX,y:t.clientY})}return arr}
function syncTouches(list){touches.clear();for(const t of list)touches.set(t.id,{x:t.x,y:t.y})}
function pinchDist(list){if(list.length<2)return 0;return Math.hypot(list[0].x-list[1].x,list[0].y-list[1].y)}
function midpoint(list){if(list.length<2)return{x:list[0].x,y:list[0].y};return{x:(list[0].x+list[1].x)/2,y:(list[0].y+list[1].y)/2}}

function onTouchStart(e){
  e.preventDefault();
  const list=touchList(e);
  // double-tap reset (single finger, quick second tap)
  if(list.length===1&&e.changedTouches.length===1){
    const now=performance.now();
    if(now-V.lastTap<280){resetView();V.lastTap=0}
    else V.lastTap=now;
  }
  V.dragging=true; V.vy=0; V.vp=0;
  syncTouches(list);
  if(list.length>=2){
    V.pinch0=pinchDist(list); V.uz0=V.userZoom;
    const m=midpoint(list); V.midX=m.x; V.midY=m.y;
  }else if(list.length===1){
    V.midX=list[0].x; V.midY=list[0].y;
  }
}
function onTouchMove(e){
  e.preventDefault();
  const list=touchList(e);
  if(!list.length)return;
  if(list.length>=2){
    const d=pinchDist(list);
    if(V.pinch0>0){
      V.userZoom=clampUz(V.uz0*(d/V.pinch0));
    }
    const m=midpoint(list);
    applyRotate(m.x-V.midX, m.y-V.midY);
    V.midX=m.x; V.midY=m.y;
  }else{
    const t=list[0];
    applyRotate(t.x-V.midX, t.y-V.midY);
    V.midX=t.x; V.midY=t.y;
  }
  syncTouches(list);
}
function onTouchEnd(e){
  e.preventDefault();
  const list=touchList(e);
  syncTouches(list);
  if(list.length>=2){
    V.pinch0=pinchDist(list); V.uz0=V.userZoom;
    const m=midpoint(list); V.midX=m.x; V.midY=m.y;
  }else if(list.length===1){
    V.midX=list[0].x; V.midY=list[0].y; V.pinch0=0;
  }else{
    V.dragging=false; V.pinch0=0;
  }
}

function onPointerDown(e){
  if(e.pointerType==='touch')return; // touch path owns mobile
  if(e.button!==0)return;
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  V.dragging=true; V.vy=0; V.vp=0;
  V.midX=e.clientX; V.midY=e.clientY;
  // double-click reset
  const now=performance.now();
  if(now-V.lastTap<280){resetView();V.lastTap=0} else V.lastTap=now;
}
function onPointerMove(e){
  if(e.pointerType==='touch')return;
  if(!V.dragging)return;
  applyRotate(e.clientX-V.midX, e.clientY-V.midY);
  V.midX=e.clientX; V.midY=e.clientY;
}
function onPointerUp(e){
  if(e.pointerType==='touch')return;
  V.dragging=false;
}

// Block Safari page-zoom gestures
['gesturestart','gesturechange','gestureend'].forEach(t=>{
  document.addEventListener(t,e=>e.preventDefault(),{passive:false});
});
document.addEventListener('touchmove',e=>{if(e.target===cv||e.target===document.body||e.target===document.documentElement)e.preventDefault()},{passive:false});

if(hasTouch){
  cv.addEventListener('touchstart',onTouchStart,{passive:false});
  cv.addEventListener('touchmove',onTouchMove,{passive:false});
  cv.addEventListener('touchend',onTouchEnd,{passive:false});
  cv.addEventListener('touchcancel',onTouchEnd,{passive:false});
}else{
  cv.addEventListener('pointerdown',onPointerDown);
  cv.addEventListener('pointermove',onPointerMove);
  cv.addEventListener('pointerup',onPointerUp);
  cv.addEventListener('pointercancel',onPointerUp);
  cv.addEventListener('pointerleave',e=>{if(V.dragging)onPointerUp(e)});
}
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  V.userZoom=clampUz(V.userZoom*Math.exp(-e.deltaY*.0015));
},{passive:false});

window.addEventListener('resize',()=>size());
document.getElementById('zm').onclick=function(){V.userZoom=clampUz(V.userZoom/1.35)};
document.getElementById('zp').onclick=function(){V.userZoom=clampUz(V.userZoom*1.35)};
document.getElementById('pp').onclick=function(){play=!play;this.textContent=play?'❚❚':'▶'};
document.getElementById('sp').onclick=function(){speed=speed>=8?1:speed*2;this.textContent=speed+'×'};
document.getElementById('rv').onclick=function(){resetView()};
document.getElementById('rs').onclick=function(){S=[];T=0;next=0;V.fit=1.2;last=0;resetView()};

// expose for headless tests
window.__sphereV=V; window.__sphereMarker=MARKER;

size();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
