<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>Prime Sphere</title>
<style>
html,body{margin:0;height:100%;height:100dvh;background:#05080f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
#ui{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;z-index:2;-webkit-tap-highlight-color:transparent}
button{background:rgba(255,255,255,.12);color:#ddd;border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:10px 16px;font:15px -apple-system,system-ui,sans-serif;min-width:44px;min-height:44px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<button type="button" id="pp" aria-label="pause">❚❚</button>
<button type="button" id="sp" aria-label="speed">1×</button>
<button type="button" id="rv" aria-label="reset view">⟲</button>
<button type="button" id="rs" aria-label="restart">✦</button>
</div>
<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
function isP(n){if(n<2)return false;if(n%2===0)return n===2;for(let d=3;d*d<=n;d+=2)if(n%d===0)return false;return true}
const G=Math.PI*(3-Math.sqrt(5));
function nrm(k){if(k<8){const a=(8+14*k)*Math.PI/180;return[0,Math.cos(a),Math.sin(a)]}const i=k-8,y=1-((i*.618034)%1)*2,r=Math.sqrt(Math.max(0,1-y*y)),f=i*G;return[Math.cos(f)*r,y,Math.sin(f)*r]}
function bas(n){const a=Math.abs(n[0])<.9?[1,0,0]:[0,1,0];let u=[n[1]*a[2]-n[2]*a[1],n[2]*a[0]-n[0]*a[2],n[0]*a[1]-n[1]*a[0]];const L=Math.hypot(u[0],u[1],u[2]);u=[u[0]/L,u[1]/L,u[2]/L];return[u,[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]]]}
const rad=k=>Math.pow(k+1,.75);
function mk(k,born){const n=nrm(k),[u,v]=bas(n),r=rad(k),pts=[],th=[];for(let m=360*k;m<360*(k+1);m++)if(m>5&&isP(m)){const t=(m%360)*Math.PI/180,c=Math.cos(t),s=Math.sin(t);pts.push([r*(u[0]*c+v[0]*s),r*(u[1]*c+v[1]*s),r*(u[2]*c+v[2]*s)]);th.push(m%360)}
const hue=k<28?300-250*k/27:(50-(k-28)*9+3600)%360;return{k,pts,th,hue,born}}
const GROW=2600,MAXC=14;let S=[],T=0,next=0,last=0,play=true,speed=1;
const V={yaw:.3,pitch:.35,zoom:1,fit:1.2,drag:false,lx:0,ly:0,pinch:0};const ptr=new Map();
function size(){const dpr=Math.min(window.devicePixelRatio||1,3),W=window.innerWidth||document.documentElement.clientWidth,H=window.innerHeight||document.documentElement.clientHeight;const tw=Math.max(1,Math.round(W*dpr)),th=Math.max(1,Math.round(H*dpr));if(cv.width!==tw||cv.height!==th){cv.width=tw;cv.height=th}return{dpr,W,H}}
function frame(now){requestAnimationFrame(frame);const{dpr,W,H}=size();
const dt=last?Math.min(64,now-last):16;last=now;
if(play){T+=dt*speed;if(!V.drag)V.yaw+=.00018*dt*Math.max(1,speed*.6);while(T>=next){S.push(mk(S.length,next));next+=S.length<8?2400:1600}}
let rt=1.2;for(const s of S){const p=Math.min(1,(T-s.born)/GROW);rt=Math.max(rt,rad(s.k)*(.4+.6*p)*1.08)}V.fit+=(rt-V.fit)*Math.min(1,dt/500);
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#05080f';ctx.fillRect(0,0,W,H);
const cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),cp=Math.cos(V.pitch),sp=Math.sin(V.pitch),sc=.46*Math.min(W,H)*V.zoom/V.fit,D=V.fit*4;
const pr=q=>{const x1=q[0]*cy+q[2]*sy,z1=-q[0]*sy+q[2]*cy,y2=q[1]*cp-z1*sp,z2=q[1]*sp+z1*cp,f=D/(D+z2);return[W/2+x1*sc*f,H/2-y2*sc*f,z2]};
ctx.globalCompositeOperation='lighter';const n=S.length;
for(let si=0;si<n;si++){const s=S[si],age=T-s.born;if(age<0)continue;const p=Math.min(1,age/GROW),g=.4+.6*(1-Math.pow(1-p,3));
const P=s.pts.map(q=>pr([q[0]*g,q[1]*g,q[2]*g])),shown=Math.max(1,Math.ceil(P.length*Math.min(1,Math.max(p,.02)*1.6)));
if(n-1-si<MAXC){const cpg=Math.max(0,(p-.25)/.75),fade=1-Math.max(0,(n-1-si)-(MAXC-4))/4;ctx.strokeStyle='hsla('+s.hue+',90%,60%,'+(.07*fade).toFixed(3)+')';ctx.lineWidth=.6;ctx.beginPath();const m=P.length,lim=Math.floor(m*cpg);for(let i=0;i<lim;i++)for(let j=i+1;j<m;j++){ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[j][0],P[j][1])}ctx.stroke()}
if(si>0&&p>.3){const pv=S[si-1],pg=.4+.6*Math.min(1,(T-pv.born)/GROW),idx=new Map();pv.th.forEach((t,i)=>idx.set(t,i));ctx.strokeStyle='hsla('+s.hue+',40%,88%,'+(.35*Math.min(1,(p-.3)/.4)).toFixed(3)+')';ctx.lineWidth=.8;ctx.beginPath();s.th.forEach((t,i)=>{const j=idx.get(t);if(j===undefined)return;const a=pr(pv.pts[j].map(x=>x*pg));ctx.moveTo(a[0],a[1]);ctx.lineTo(P[i][0],P[i][1])});ctx.stroke()}
for(let i=0;i<shown;i++){const q=P[i],rr=Math.max(1,2.1*D/(D+q[2]));ctx.fillStyle='hsla('+s.hue+',95%,60%,.18)';ctx.beginPath();ctx.arc(q[0],q[1],rr*2.6,0,6.2832);ctx.fill();ctx.fillStyle='hsla('+s.hue+',95%,72%,.95)';ctx.beginPath();ctx.arc(q[0],q[1],rr,0,6.2832);ctx.fill()}}
ctx.globalCompositeOperation='source-over'}
function onDown(id,x,y){ptr.set(id,[x,y]);V.drag=true;V.lx=x;V.ly=y;if(ptr.size===2){const pts=[...ptr.values()];V.pinch=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1])}}
function onMove(id,x,y){if(!ptr.has(id))return;ptr.set(id,[x,y]);if(ptr.size===2){const pts=[...ptr.values()],d=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);if(V.pinch>0)V.zoom=Math.min(6,Math.max(.3,V.zoom*d/V.pinch));V.pinch=d;return}V.yaw+=(x-V.lx)*.008;V.pitch=Math.max(-1.5,Math.min(1.5,V.pitch+(y-V.ly)*.008));V.lx=x;V.ly=y}
function onUp(id){ptr.delete(id);V.pinch=0;if(!ptr.size)V.drag=false;else{const a=[...ptr.values()][0];V.lx=a[0];V.ly=a[1]}}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){ }onDown(e.pointerId,e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>onMove(e.pointerId,e.clientX,e.clientY));
const up=e=>onUp(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)onDown('t'+t.identifier,t.clientX,t.clientY)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)onMove('t'+t.identifier,t.clientX,t.clientY)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)onUp('t'+t.identifier)},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)onUp('t'+t.identifier)},{passive:false});
cv.addEventListener('wheel',e=>{e.preventDefault();V.zoom=Math.min(6,Math.max(.3,V.zoom*Math.exp(-e.deltaY*.0015)))},{passive:false});
window.addEventListener('resize',()=>size());
document.getElementById('pp').onclick=function(){play=!play;this.textContent=play?'❚❚':'▶'};
document.getElementById('sp').onclick=function(){speed=speed>=8?1:speed*2;this.textContent=speed+'×'};
document.getElementById('rv').onclick=function(){V.zoom=1;V.yaw=.3;V.pitch=.35};
document.getElementById('rs').onclick=function(){S=[];T=0;next=0;V.fit=1.2;last=0};
size();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
